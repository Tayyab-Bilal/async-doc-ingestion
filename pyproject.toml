[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "async-doc-ingestion"
version = "0.1.0"
description = "Crash-safe, idempotent, tenant-isolated document ingestion for RAG (clean-room reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
api = ["fastapi>=0.110"]
celery = ["celery>=5.3"]
dev = ["fastapi>=0.110", "httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
